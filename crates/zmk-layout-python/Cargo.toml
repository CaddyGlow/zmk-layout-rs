[package]
name = "zmk-layout-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings for ZMK layout manipulation - loadable as a Python extension module"

[lib]
crate-type = ["cdylib"]

[dependencies]
zmk-layout-core = { path = "../zmk-layout-core" }
pyo3 = { version = "0.27", features = ["extension-module"] }
thiserror = "2"
toml = "0.8"
serde_json = "1"
log = "0.4"
