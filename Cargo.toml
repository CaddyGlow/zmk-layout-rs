[package]
name = "zmk-layout-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
logos = "0.15"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
similar = "2"
tempfile = "3"
dirs = "5"
minijinja = "1"
signal-hook = "0.3"
mlua = { version = "0.9", features = ["lua54", "vendored"] }
regex = "1"
plist = "1"
rust-embed = "8"
log = "0.4"
env_logger = { version = "0.10", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
