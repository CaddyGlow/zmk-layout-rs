[package]
name = "zmk-layout-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
logos = "0.15"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
similar = "2"
rhai = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
