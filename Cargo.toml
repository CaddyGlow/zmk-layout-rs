[workspace]
resolver = "2"
members = [
    "crates/zmk-layout-core",
    "crates/zmk-layout-lua",
    "crates/zmk-layout",
]
# Excluded because "module" and "vendored" mlua features are mutually exclusive.
# Build separately with: cargo build -p zmk-layout-lua-module
# Python crate excluded because pyo3 extension-module requires separate build.
# Build with: cd crates/zmk-layout-python && maturin build --release
exclude = [
    "crates/zmk-layout-lua-module",
    "crates/zmk-layout-python",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Workspace crates
zmk-layout-core = { path = "crates/zmk-layout-core" }
zmk-layout-lua = { path = "crates/zmk-layout-lua", default-features = false }

# Core dependencies
logos = "0.15"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
similar = "2"
tempfile = "3"
dirs = "5"
minijinja = "1"
signal-hook = "0.3"
regex = "1"
plist = "1"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
log = "0.4"

# Lua dependency
mlua = { version = "0.9", features = ["lua54", "vendored"] }

# CLI dependencies
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.10", default-features = false }

# Optional preprocessor
ancpp = { git = "https://github.com/hemashushu/xiaoxuan-c-preprocessor.git" }

# Platform-specific
nix = { version = "0.29", features = ["user"] }

# Dev dependencies
assert_cmd = "2"
predicates = "3"
